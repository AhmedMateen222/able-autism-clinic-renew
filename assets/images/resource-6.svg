<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <rect width="500" height="300" fill="#F0FDF4" rx="16"/>
  <!-- School Advocacy & Supporting Siblings: Family Hands & Heart -->
  <g transform="translate(250, 140)">
    <!-- Shield / Support Frame -->
    <path d="M 0 -80 L 70 -40 L 70 30 C 70 80 0 110 0 110 C 0 110 -70 80 -70 30 L -70 -40 Z" fill="#DCFCE7" stroke="#10B981" stroke-width="4"/>
    <!-- Heart in Center -->
    <path d="M 0 0 C 0 -18 20 -28 32 -10 C 44 10 0 45 0 45 C 0 45 -44 10 -32 -10 C -20 -28 0 -18 0 0 Z" fill="#F59E0B"/>
    <!-- Helping Hands / Stars -->
    <circle cx="0" cy="-35" r="8" fill="#0284C7"/>
  </g>
  <circle cx="100" cy="70" r="10" fill="#FBBF24"/>
  <circle cx="400" cy="80" r="12" fill="#38BDF8"/>
  <circle cx="120" cy="220" r="8" fill="#34D399"/>
  <circle cx="380" cy="210" r="9" fill="#F59E0B"/>
</svg>
