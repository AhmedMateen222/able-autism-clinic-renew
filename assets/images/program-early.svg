<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <rect width="500" height="300" fill="#FEF3C7" rx="16"/>
  <!-- Sensory Path & Play Mats -->
  <circle cx="250" cy="150" r="110" fill="#FDE68A" opacity="0.6"/>
  <circle cx="150" cy="180" r="50" fill="#BAE6FD" opacity="0.8"/>
  <circle cx="350" cy="180" r="50" fill="#A7F3D0" opacity="0.8"/>
  <!-- Interactive Toys -->
  <polygon points="250,70 290,140 210,140" fill="#0284C7"/>
  <circle cx="250" cy="190" r="30" fill="#F59E0B"/>
  <circle cx="250" cy="190" r="15" fill="#FEF3C7"/>
  <!-- Sparkles -->
  <circle cx="110" cy="90" r="8" fill="#F59E0B"/>
  <circle cx="390" cy="90" r="8" fill="#10B981"/>
  <circle cx="250" cy="40" r="6" fill="#0284C7"/>
  <!-- Footprints / Milestones -->
  <ellipse cx="180" cy="240" rx="14" ry="20" fill="#0284C7" opacity="0.6" transform="rotate(-15 180 240)"/>
  <ellipse cx="230" cy="245" rx="14" ry="20" fill="#10B981" opacity="0.6" transform="rotate(15 230 245)"/>
  <ellipse cx="280" cy="240" rx="14" ry="20" fill="#F59E0B" opacity="0.6" transform="rotate(-15 280 240)"/>
  <ellipse cx="330" cy="245" rx="14" ry="20" fill="#0284C7" opacity="0.6" transform="rotate(15 330 245)"/>
</svg>
