<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Room -->
  <rect width="600" height="450" fill="url(#bgGrad)"/>
  
  <!-- Floor -->
  <path d="M 0 340 L 600 340 L 600 450 L 0 450 Z" fill="#E2E8F0"/>
  <line x1="0" y1="340" x2="600" y2="340" stroke="#CBD5E1" stroke-width="3"/>
  <ellipse cx="300" cy="385" rx="220" ry="45" fill="#FEF08A" opacity="0.6"/>

  <!-- Sensory Sun Arc on Wall -->
  <circle cx="500" cy="100" r="60" fill="url(#sunGrad)" opacity="0.35"/>
  <circle cx="500" cy="100" r="40" fill="#FDE047" opacity="0.5"/>

  <!-- Calming Sensory Wall Shelves with Developmental Toys -->
  <rect x="60" y="120" width="160" height="12" rx="4" fill="#94A3B8"/>
  <rect x="80" y="85" width="25" height="35" rx="3" fill="#38BDF8"/>
  <rect x="115" y="75" width="22" height="45" rx="3" fill="#34D399"/>
  <circle cx="165" cy="100" r="18" fill="#FBBF24"/>

  <!-- Sensory Swing / Pod -->
  <path d="M 460 0 L 460 140" stroke="#64748B" stroke-width="4"/>
  <path d="M 400 140 C 400 240 520 240 520 140 C 520 100 400 100 400 140 Z" fill="url(#cushionGrad)" opacity="0.9"/>
  <circle cx="460" cy="170" r="30" fill="#E0F2FE"/>

  <!-- Calming Sensory Light Tube / Bubble Column -->
  <rect x="50" y="160" width="28" height="180" rx="14" fill="#BAE6FD" opacity="0.85"/>
  <circle cx="64" cy="190" r="5" fill="#FFFFFF"/>
  <circle cx="64" cy="230" r="7" fill="#FFFFFF"/>
  <circle cx="64" cy="280" r="6" fill="#FFFFFF"/>
  <circle cx="64" cy="320" r="8" fill="#FFFFFF"/>

  <!-- Therapy Activity Soft Play Mat & Blocks -->
  <!-- Triangle Foam Block -->
  <polygon points="170,340 230,240 290,340" fill="url(#greenGrad)"/>
  <!-- Cylinder foam -->
  <rect x="250" y="270" width="80" height="70" rx="18" fill="#F59E0B"/>
  
  <!-- Interactive Stacking Rings -->
  <ellipse cx="370" cy="335" rx="32" ry="10" fill="#EF4444"/>
  <ellipse cx="370" cy="320" rx="26" ry="8" fill="#F97316"/>
  <ellipse cx="370" cy="306" rx="20" ry="7" fill="#FACC15"/>
  <ellipse cx="370" cy="294" rx="15" ry="6" fill="#10B981"/>
  <ellipse cx="370" cy="283" rx="10" ry="5" fill="#06B6D4"/>
  <circle cx="370" cy="272" r="7" fill="#8B5CF6"/>

  <!-- Calming Plants -->
  <path d="M 540 340 L 530 280 L 570 280 L 560 340 Z" fill="#78350F"/>
  <ellipse cx="550" cy="260" rx="30" ry="40" fill="#10B981"/>
  <ellipse cx="530" cy="245" rx="25" ry="30" fill="#34D399"/>
  <ellipse cx="570" cy="245" rx="25" ry="30" fill="#059669"/>
</svg>
